<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | GSE OMS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
 body{background:#0f1b2d;height:100vh;display:flex;align-items:center;font-family:system-ui,sans-serif}
 .card{border:0;border-radius:.75rem;box-shadow:0 24px 60px rgba(0,0,0,.35)}
 .brand small{letter-spacing:1.6px;text-transform:uppercase;color:#7d92ad;font-size:.68rem}
 .brand b{font-size:1.5rem;letter-spacing:.5px}
</style></head><body>
<div class="container" style="max-width:400px">
  <div class="text-center text-white brand mb-4">
    <small>Ground Support Equipment</small><br><b>GSE OPERATIONS</b>
  </div>
  <div class="card">
    <div class="card-body p-4">
      <h1 class="h6 mb-3">Sign in</h1>
      {% if form.errors %}<div class="alert alert-danger py-2 small">Wrong username or password.</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label small fw-semibold">Username</label>
          <input name="username" class="form-control" autofocus required>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Password</label>
          <input name="password" type="password" class="form-control" required>
        </div>
        <button class="btn btn-dark w-100">Sign in</button>
      </form>
    </div>
  </div>
</div></body></html>
